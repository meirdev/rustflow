# rustflow (protobuf) -> Vector -> Kafka `flows` -> Arroyo -> Kafka `flow-stats`
#
# Demonstration only, not a production setup.

services:
  # rustflow is started by Vector (exec source, see vector.yaml); this
  # container listens for NetFlow / IPFIX on UDP 9995.
  collector:
    build:
      context: ../..
      dockerfile: examples/vector-kafka-arroyo/Dockerfile
    image: rustflow-vector
    ports:
      - "9995:9995/udp"
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ./rustflow.desc:/etc/vector/rustflow.desc:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Synthetic IPFIX so the pipeline has traffic out of the box. Remove this
  # service (or `docker compose stop generator`) to feed real exporters.
  generator:
    image: rustflow-vector
    entrypoint: ["rustflow"]
    command: ["generate", "-H", "collector", "-p", "9995", "-r", "20", "-f", "10"]
    depends_on:
      - collector
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
    ports:
      # Reachable from the host as localhost:9094
      - "9094:9094"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # Creates the two topics up front so every consumer finds them.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in flows flow-stats; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  # `arroyo run` executes pipeline.sql as a self-contained local cluster.
  # Web UI: http://localhost:5115
  arroyo:
    image: ghcr.io/arroyosystems/arroyo:0.15.0
    command: ["run", "--name", "flow-stats", "/pipeline.sql"]
    ports:
      - "5115:5115"
    volumes:
      - ./pipeline.sql:/pipeline.sql:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
