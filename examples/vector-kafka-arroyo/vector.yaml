# Vector runs rustflow, decodes its length-delimited protobuf stream, turns
# addresses and timestamps into JSON-friendly values, and produces one JSON
# message per flow to the Kafka topic `flows`.
# The API lets you inspect the pipeline from inside the container, e.g.
# `docker compose exec collector vector top`.
api:
  enabled: true
  address: 127.0.0.1:8686

sources:
  rustflow:
    type: exec
    mode: streaming
    command:
      - rustflow
      - collect
      - -t
      - netflow
      - -H
      - 0.0.0.0
      - -p
      - "9995"
      - -f
      - common
      - -s
      - protobuf
    include_stderr: false
    framing:
      method: varint_length_delimited
    decoding:
      codec: protobuf
      protobuf:
        desc_file: /etc/vector/rustflow.desc
        message_type: rustflow.CommonFlow

transforms:
  flows:
    type: remap
    inputs:
      - rustflow
    source: |
      ts = to_int(.time_received_ns) ?? 0

      . = {
        "time_received":   from_unix_timestamp(ts, unit: "nanoseconds") ?? now(),
        "flow_type":       to_string(.flow_type) ?? "",
        "sampler_address": ip_ntop(.sampler_address) ?? "",
        "src_addr":        ip_ntop(.src_addr) ?? "",
        "dst_addr":        ip_ntop(.dst_addr) ?? "",
        "src_port":        to_int(.src_port) ?? 0,
        "dst_port":        to_int(.dst_port) ?? 0,
        "proto":           to_int(.proto) ?? 0,
        "bytes":           to_int(.bytes) ?? 0,
        "packets":         to_int(.packets) ?? 0,
        "sampling_rate":   to_int(.sampling_rate) ?? 0,
      }

sinks:
  kafka:
    type: kafka
    inputs:
      - flows
    bootstrap_servers: kafka:9092
    topic: flows
    encoding:
      codec: json
      timestamp_format: rfc3339
