name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish rustflow_core
        run: cargo publish -p rustflow_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rustflow_lib
        run: cargo publish -p rustflow_lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    strategy:
      matrix:
        BUILD_TARGET: [x86_64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v4

      - name: Add the musl target
        run: rustup target add ${{ matrix.BUILD_TARGET }}

      - name: Build
        run: cargo build --release --target ${{ matrix.BUILD_TARGET }}

      - name: Update binaries to release (collector)
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: target/${{ matrix.BUILD_TARGET }}/release/rustflow_collector

      - name: Update binaries to release (exporter)
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: target/${{ matrix.BUILD_TARGET }}/release/rustflow_exporter

      - name: Update binaries to release (generator)
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: target/${{ matrix.BUILD_TARGET }}/release/rustflow_generator
