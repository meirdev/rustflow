name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # core types and parsers
      - name: Publish rustflow_core
        run: cargo publish -p rustflow_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # collector library
      - name: Publish rustflow_lib
        run: cargo publish -p rustflow_lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `rustflow collect`
      - name: Publish rustflow_collect
        run: cargo publish -p rustflow_collect
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `rustflow generate`
      - name: Publish rustflow_generate
        run: cargo publish -p rustflow_generate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `rustflow export`
      - name: Publish rustflow_export
        run: cargo publish -p rustflow_export
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # the `rustflow` binary
      - name: Publish rustflow_cli
        run: cargo publish -p rustflow_cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    strategy:
      matrix:
        BUILD_TARGET: [x86_64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v4

      - name: Add the musl target
        run: rustup target add ${{ matrix.BUILD_TARGET }}

      - name: Build
        run: cargo build --release --target ${{ matrix.BUILD_TARGET }}

      - name: Strip the binary
        run: strip target/${{ matrix.BUILD_TARGET }}/release/rustflow

      - name: Upload the rustflow binary to the release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: target/${{ matrix.BUILD_TARGET }}/release/rustflow

  docker:
    if: github.ref_type == 'tag'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # - platform: linux/arm64
          #   runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,name=docker.io/meirdev/rustflow,push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  docker-manifest:
    if: github.ref_type == 'tag'

    needs: docker

    runs-on: ubuntu-latest

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/meirdev/rustflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/meirdev/rustflow@sha256:%s ' *)

      - name: Inspect the image
        run: docker buildx imagetools inspect docker.io/meirdev/rustflow:${{ steps.meta.outputs.version }}
