[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/meirdev/rustflow"

[workspace.dependencies]
rustflow_core = { path = "crates/rustflow_core", version = "0.19.0" }
rustflow = { path = "crates/rustflow", package = "rustflow_lib", version = "0.19.0" }
rustflow_collect = { path = "crates/rustflow_collect", version = "0.19.0" }
rustflow_generate = { path = "crates/rustflow_generate", version = "0.19.0" }
rustflow_export = { path = "crates/rustflow_export", version = "0.19.0" }

anyhow = "1.0"
chrono = "0.4.43"
clap = { version = "4.5.60", features = ["derive"] }
csv = "1.4.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
etherparse = "0.19.0"
ipnet = "2.12.0"
log = "0.4.29"
macaddr = "1.0.1"
pcap-file = "2"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
socket2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
