apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: rustflow
      defaultDatabase: rustflow
      dialTimeout: "10"
      queryTimeout: "60"
    secureJsonData:
      password: rustflow
