[package]
name = "rustflow_collect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flow collector for NetFlow, IPFIX and sFlow; the `rustflow collect` command"

[dependencies]
anyhow.workspace = true
rustflow.workspace = true
rustflow_core.workspace = true
clap.workspace = true
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
prometheus-client = "0.25.1"
pcap-file.workspace = true
rustc-hash.workspace = true
serde_json = "1.0.149"
chrono.workspace = true
tiny_http = "0.12"
csv.workspace = true
serde.workspace = true
log.workspace = true
strum.workspace = true
prefix-trie = "0.10.1"
ipnet.workspace = true
duration-str = "0.21.0"
maxminddb = "0.30.3"
notify-debouncer-full = "0.7.0"
thiserror = "2.0.20"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = "60.0.0"
ctrlc.workspace = true
socket2.workspace = true
arrayvec = "0.7"
macaddr.workspace = true
prost = "0.14"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }

[dev-dependencies]
tempfile = "3"
