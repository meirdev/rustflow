[package]
name = "rustflow_collect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flow collector for NetFlow, IPFIX and sFlow; the `rustflow collect` command"

[dependencies]
rustflow.workspace = true
rustflow_core.workspace = true
clap = { version = "4.5.60", features = ["derive"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
prometheus = "0.14.0"
pcap-file = "2"
rustc-hash = "2.1.1"
serde_json = "1.0.149"
chrono = "0.4.43"
tiny_http = "0.12"
csv = "1.3"
serde = "1.0"
prefix-trie = "0.8.1"
ipnet = "2"
duration-str = "0.11"
notify-debouncer-full = "0.7"
maxminddb = "0.27"
ipnetwork = "0.21"
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
macaddr = "1"
prost = "0.14"
