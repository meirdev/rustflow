[package]
name = "rustflow_protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NetFlow v5, NetFlow v9, IPFIX and sFlow v5 packets, parsed and written"

[features]
jiff = ["dep:jiff"]
serde = ["dep:serde"]

[dependencies]
jiff = { version = "0.2.21", optional = true, default-features = false, features = ["std"] }
num_enum = "0.7.5"
rustflow_bytes = { path = "../rustflow_bytes" }
rustc-hash.workspace = true
serde = { workspace = true, optional = true, features = ["rc"] }

[dev-dependencies]
serde_json = "1.0.149"
