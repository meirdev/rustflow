[package]
name = "rustflow_sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Output sinks for the rustflow collector: encoders, destinations and file rotation"

[dependencies]
rustflow_core.workspace = true
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
chrono = "0.4.43"
csv = "1.3"
macaddr = "1"
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap"] }
prometheus = "0.14.0"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

[[bench]]
name = "encoders"
harness = false
