[package]
name = "rustflow_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NetFlow, IPFIX and sFlow: parsed and written, converted to IPFIX information elements, and read from sockets"

[features]
jiff = ["dep:jiff"]
pcap = ["dep:pcap-file"]
serde = ["dep:serde"]
socket2 = ["dep:socket2"]
tokio = ["dep:futures-core", "dep:tokio", "socket2"]

[dependencies]
etherparse.workspace = true
futures-core = { version = "0.3", optional = true }
jiff = { version = "0.2.21", optional = true, default-features = false, features = ["std"] }
macaddr.workspace = true
num_enum = "0.7.5"
pcap-file = { workspace = true, optional = true }
rustc-hash.workspace = true
serde = { workspace = true, optional = true, features = ["rc"] }
socket2 = { workspace = true, optional = true }
tokio = { version = "1", features = ["net", "time"], optional = true }

[dev-dependencies]
pcap-file.workspace = true
serde_json = "1.0.149"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
