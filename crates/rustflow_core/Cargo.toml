[package]
name = "rustflow_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NetFlow, IPFIX and sFlow: parsing, encoding, conversion to common flows, and readers for sockets and pcap files"

[features]
pcap = ["dep:pcap-file"]
serde = ["dep:serde", "dep:hex"]
tokio = ["dep:tokio", "dep:futures-core"]

[dependencies]
bytes = "1.12.1"
futures-core = { version = "0.3.34", optional = true }
hex = { version = "0.4.3", features = ["serde"], optional = true }
jiff = "0.2.41"
num_enum = "0.7.6"
pcap-file = { workspace = true, optional = true }
rustc-hash.workspace = true
serde = { workspace = true, features = ["rc"], optional = true }
socket2.workspace = true
strum.workspace = true
tokio = { version = "1.54.1", features = ["net"], optional = true }
winnow = "1.0.5"

[[example]]
name = "fuzz_corpus"
required-features = ["pcap"]
