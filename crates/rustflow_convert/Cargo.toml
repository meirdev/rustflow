[package]
name = "rustflow_convert"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flow records of NetFlow, IPFIX and sFlow converted to IPFIX information elements"

[features]
serde = ["dep:serde", "rustflow_protocol/serde"]

[dependencies]
rustflow_protocol = { path = "../rustflow_protocol" }
rustflow_dissect = { path = "../rustflow_dissect" }
serde = { workspace = true, optional = true }

[dev-dependencies]
etherparse.workspace = true
serde_json = "1.0.149"
