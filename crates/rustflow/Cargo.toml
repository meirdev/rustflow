[package]
name = "rustflow-lib"
version.workspace = true
edition = "2024"
description = "High-performance flow collector library for NetFlow, IPFIX, and sFlow"
license = "BSD-3-Clause"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
rustflow_core = { path = "../rustflow_core", version = "0.5.0" }
chrono = "0.4"
log = "0.4"
rustc-hash = "2.1"
tokio = { version = "1", features = ["net"], optional = true }
pcap-file = "2"
