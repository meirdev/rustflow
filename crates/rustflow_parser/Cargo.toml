[package]
name = "rustflow_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
chrono = { version = "0.4.43", features = ["serde"] }
hex = "0.4.3"
macaddr = { version = "1.0.1", features = ["serde"] }
nom = "8.0.0"
primitive-types = { version = "0.14.0", features = ["serde"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
