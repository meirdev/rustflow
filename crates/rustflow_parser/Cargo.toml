[package]
name = "rustflow_parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parsers for flow protocols, built on rustflow_reader"

[features]
jiff = ["dep:jiff"]
serde = ["dep:serde"]

[dependencies]
jiff = { version = "0.2.21", optional = true, default-features = false, features = ["std"] }
num_enum = "0.7.5"
rustflow_reader = { path = "../rustflow_reader" }
rustc-hash.workspace = true
serde = { workspace = true, optional = true, features = ["rc"] }

[dev-dependencies]
serde_json = "1.0.149"
