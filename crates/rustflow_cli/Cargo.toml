[package]
name = "rustflow_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RustFlow command line interface: collect, generate and export NetFlow, IPFIX and sFlow"
keywords = ["netflow", "ipfix", "sflow", "flow", "network"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "rustflow"
path = "src/main.rs"

[features]
pcap = ["rustflow_export/pcap"]

[dependencies]
rustflow_export.workspace = true
rustflow_collect.workspace = true
rustflow_generate.workspace = true
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
