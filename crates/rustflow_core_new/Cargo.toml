[package]
name = "rustflow_core_new"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NetFlow, IPFIX and sFlow: parsed and written, converted to IPFIX information elements, and read from sockets"
# Becomes rustflow_core when it replaces it; until then, not to be published.
publish = false

[features]
jiff = ["dep:jiff"]
serde = ["dep:serde"]

[dependencies]
etherparse.workspace = true
jiff = { version = "0.2.21", optional = true, default-features = false, features = ["std"] }
num_enum = "0.7.5"
rustc-hash.workspace = true
serde = { workspace = true, optional = true, features = ["rc"] }

[dev-dependencies]
serde_json = "1.0.149"
