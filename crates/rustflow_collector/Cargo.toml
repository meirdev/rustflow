[package]
name = "rustflow_collector"
version = "0.1.0"
edition = "2024"

[dependencies]
rustflow_core = { path = "../rustflow_core" }
rustflow_parser = { path = "../rustflow_parser" }
clap = { version = "4.5.45", features = ["derive"] }
chrono = "0.4.41"
prometheus = "0.14.0"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
serde = { version = "1.0.219", features = ["derive"] }
csv = "1.3.1"
rustc-hash = "2.1.1"
pnet = "0.35.0"
pcap = "2.3.0"
