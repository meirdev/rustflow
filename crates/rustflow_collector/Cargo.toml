[package]
name = "rustflow_collector"
version = "0.1.0"
edition = "2024"

[dependencies]
rustflow_core = { path = "../rustflow_core" }
clap = { version = "4.5.60", features = ["derive"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
prometheus = "0.14.0"
pcap-file = "2"
rustc-hash = "2.1.1"
serde_json = "1.0.149"
chrono = "0.4.43"
tiny_http = "0.12"
csv = "1.3"
serde = "1.0"
prefix-trie = "0.8.1"
ipnet = "2"
duration-str = "0.11"
